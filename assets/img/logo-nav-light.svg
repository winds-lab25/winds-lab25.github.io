<style>
  .wnclassiclight .arc{fill:none;stroke:url(#wnclassiclight-arcs);stroke-width:15;stroke-linecap:round;stroke-dasharray:var(--len) calc(var(--len) + 40);stroke-dashoffset:var(--len);opacity:0;
    animation:wnclassiclight-draw .75s cubic-bezier(.22,1,.36,1) var(--d) forwards}
  .wnclassiclight .arcg{animation:wnclassiclight-signal 3.6s ease-in-out calc(var(--d) + 2.3s) infinite;animation-duration:6s}
  .wnclassiclight .dot{transform-box:fill-box;transform-origin:center;animation:wnclassiclight-pop .65s cubic-bezier(.34,1.56,.64,1) both}
  .wnclassiclight .halo{transform-box:fill-box;transform-origin:center;animation:wnclassiclight-halo 3.6s ease-out .3s infinite;opacity:0}
  .wnclassiclight .ltr{transform-box:fill-box;transform-origin:50% 100%;animation:wnclassiclight-rise .75s cubic-bezier(.34,1.45,.64,1) var(--d) both}
  .wnclassiclight .tag{animation:wnclassiclight-fade .9s ease-out 1.75s both}
  .wnclassiclight .shine{animation:wnclassiclight-shine 5.4s ease-in-out 2.6s 1;transform:translateX(-260px)}
  @keyframes wnclassiclight-pop{0%{transform:scale(0);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes wnclassiclight-halo{0%{transform:scale(.6);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
  @keyframes wnclassiclight-draw{0%{stroke-dashoffset:var(--len);opacity:0}12%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
  @keyframes wnclassiclight-signal{0%,100%{opacity:1}14%{opacity:.28}34%{opacity:1}}
  @keyframes wnclassiclight-rise{0%{transform:translateY(34px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wnclassiclight-fade{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes wnclassiclight-shine{0%{transform:translateX(-260px)}38%,100%{transform:translateX(891px)}}
  @media (prefers-reduced-motion:reduce){.wnclassiclight *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.wnclassiclight .halo,.wnclassiclight .shine{display:none}}</style>
